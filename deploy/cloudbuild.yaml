substitutions:
  _REGION: europe-west1
  _SERVICE: agenteng-hq
  _REPOSITORY: cloud-run-source-deploy
  _TAG: v0.1.0
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --concurrency=40
      - --memory=512Mi
      - --cpu=1
      - --timeout=60
      - --set-env-vars=AGENTENG_PUBLIC_URL=https://a2a.agentengineering.world,AGENTENG_ENABLE_STANDARD=0,AGENTENG_ENABLE_RLM=0
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
