name: Bug report
description: Report an issue with the CLI, catalogue, MCP or A2A behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: >-
        Please remove credentials, personal data and private event information.
        Vulnerabilities belong in private security reporting; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: AgentEng version and environment
      placeholder: '0.1.0; Python 3.12; Linux; CLI / MCP / A2A'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps to reproduce
      description: Include a redacted command or request, plus the public event ID if relevant.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I removed credentials and private/personal information.
          required: true
