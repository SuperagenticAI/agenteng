name: CI
"on":
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.0'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - name: Check package and release versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            uv run --frozen python scripts/check-release-metadata.py --tag "$RELEASE_TAG"
          else
            uv run --frozen python scripts/check-release-metadata.py
          fi
      - run: uv run --frozen python scripts/check-public-release.py
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen pytest -q
      - run: uv build
      - run: uv run --frozen python scripts/check-public-release.py --artifacts
      - run: uv run --frozen python scripts/verify-release.py
      - run: uv run --frozen python scripts/stage-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: agenteng-python-${{ matrix.python }}
          path: dist/
