site_name: Agent Engineering HQ
site_url: https://superagenticai.github.io/agenteng/
site_description: The home of the agent engineering discipline. Explore London and San Francisco events, tools and community with AgentEng CLI, MCP and A2A.
site_author: Agent Engineering HQ
repo_name: SuperagenticAI/agenteng
repo_url: https://github.com/SuperagenticAI/agenteng
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

# Publish only reviewed public guides and brand assets, even if other files
# happen to exist in the local docs directory. Keep Material's bundled CSS/JS.
exclude_docs: |
  **
  !/index.md
  !/COMMANDS.md
  !/INTEGRATIONS.md
  !/ACP.md
  !/TOOLS.md
  !/PARTICIPATION.md
  !/COMMUNITY.md
  !/DATA.md
  !/SITE-SYNC.md
  !/ARCHITECTURE.md
  !/RELEASING.md
  !/assets/
  !/assets/logo.png
  !/assets/favicon.png
  !/assets/stylesheets/
  !/assets/stylesheets/**
  !/assets/javascripts/
  !/assets/javascripts/**
  !/stylesheets/
  !/stylesheets/extra.css

nav:
  - 🚀 Start here: index.md
  - ⌨️ Commands: COMMANDS.md
  - 🤖 MCP & A2A: INTEGRATIONS.md
  - 🤝 ACP client (experimental): ACP.md
  - 🧰 Tool directory: TOOLS.md
  - 💡 Public participation policy: PARTICIPATION.md
  - 📚 Reference:
      - 🤝 Community: COMMUNITY.md
      - 📖 Data & attribution: DATA.md
      - 🔁 Site command sync: SITE-SYNC.md
      - 🏗️ Architecture & optional RLM: ARCHITECTURE.md
      - 📦 Releases & documentation: RELEASING.md
  - 🌍 Event website: https://agentengineering.world

extra:
  generator: false
